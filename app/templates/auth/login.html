<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudyForge</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="background-glow">
        <div class="glow-bubble bubble-1"></div>
        <div class="glow-bubble bubble-2"></div>
    </div>
    
    <div class="auth-container">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <div class="app-logo">
                    <span class="logo-icon">🛠️</span>
                    <h1 class="logo-text">Study<span>Forge</span></h1>
                </div>
                <p class="auth-subtitle">Craft Consistency. Forge Excellence.</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <i class="fa-solid {% if category == 'danger' %}fa-circle-xmark{% else %}fa-circle-info{% endif %}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username_or_email"><i class="fa-solid fa-user"></i> Username or Email</label>
                    <input type="text" id="username_or_email" name="username_or_email" placeholder="Enter username or email" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember" id="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>New to StudyForge? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
